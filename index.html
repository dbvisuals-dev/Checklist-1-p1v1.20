<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Industrial Field Task List - Fully Reactive State</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .mono-font { font-family: 'Share Tech Mono', monospace; }
        .completed-task { opacity: 0.4; text-decoration: line-through; }
        
        input[type=range] {
            height: 12px;
            border-radius: 4px;
            appearance: none;
            background: #27272a;
            border: 1px solid #52525b;
        }
        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            width: 36px;
            height: 28px;
            border-radius: 4px;
            background: #0ea5e9;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 2px 6px rgba(0,0,0,0.6);
            border: 1px solid #0284c7;
        }

        input[type=checkbox] {
            appearance: none;
            background-color: #09090b;
            border: 1.5px solid #71717a;
            border-radius: 0.375rem;
            cursor: pointer;
            display: grid;
            place-content: center;
            transition: all 0.2s ease;
        }
        input[type=checkbox]::before {
            content: "";
            width: 0.65rem;
            height: 0.65rem;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #22c55e;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        input[type=checkbox]:checked {
            background-color: #052e16;
            border-color: #22c55e;
        }
        input[type=checkbox]:checked::before {
            transform: scale(1);
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen pb-20 antialiased selection:bg-cyan-500 selection:text-white">
    <header class="bg-zinc-900 text-zinc-100 pt-8 pb-8 px-5 border-b-4 border-cyan-500 shadow-2xl relative overflow-hidden">
        <div id="header-watermark-tl" class="absolute left-2 -top-2 opacity-20 font-bold text-[7rem] leading-none mono-font pointer-events-none select-none text-zinc-600 tracking-tighter">0%</div>
        <div id="header-watermark-br" class="absolute -right-6 -bottom-10 opacity-15 font-bold text-[11rem] leading-none mono-font pointer-events-none select-none text-cyan-400 tracking-tighter">0%</div>

        <div class="max-w-md mx-auto relative z-10">
            <div class="flex justify-between items-center mb-3">
                <span id="sync-status" class="text-[9px] mono-font uppercase tracking-widest bg-amber-500/20 text-amber-300 px-2.5 py-0.5 rounded border border-amber-500/40">INITIALIZING...</span>
                <button type="button" id="reset-btn" class="text-xs font-mono uppercase bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3 py-1.5 rounded transition border border-zinc-600 active:scale-95 shadow-sm font-semibold">Reset</button>
            </div>

            <div class="flex justify-between items-center mb-4">
                <div>
                    <span class="text-[11px] mono-font uppercase tracking-wider bg-cyan-500/20 backdrop-blur text-cyan-300 px-2.5 py-1 rounded font-bold border border-cyan-500/40">STATUS: REACTIVE STATE SYNC</span>
                    <h1 class="text-2xl font-bold mt-2 tracking-tight uppercase font-mono text-white">Job Site Checklist</h1>
                </div>
            </div>
            
            <div class="mt-6 bg-zinc-950 p-4 rounded-lg border border-zinc-700/80 shadow-inner">
                <div class="flex justify-between text-xs mb-2 font-mono uppercase tracking-wider font-semibold">
                    <span id="progress-text" class="text-zinc-300">0 of 0 completed</span>
                    <span id="progress-percent" class="text-cyan-400 font-bold">0%</span>
                </div>
                <div class="w-full bg-zinc-900 h-3 rounded-sm overflow-hidden p-0.5 border border-zinc-700">
                    <div id="progress-bar" class="bg-cyan-500 h-full rounded-sm transition-all duration-300 w-0 shadow-[0_0_10px_rgba(6,182,212,0.6)]"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-6 space-y-4">
        <div class="flex bg-zinc-900 p-1 rounded-lg border border-zinc-700 text-xs font-mono uppercase shadow-sm">
            <button type="button" data-filter="all" class="filter-tab flex-1 py-2.5 rounded bg-cyan-600 text-white font-bold transition shadow">All Ops</button>
            <button type="button" data-filter="active" class="filter-tab flex-1 py-2.5 rounded text-zinc-300 transition hover:text-white font-semibold">Pending</button>
            <button type="button" data-filter="completed" class="filter-tab flex-1 py-2.5 rounded text-zinc-300 transition hover:text-white font-semibold">Done</button>
        </div>

        <div id="task-list" class="space-y-3.5"></div>

        <div class="mt-8 bg-zinc-900 p-5 rounded-lg border border-zinc-700 shadow-lg">
            <h3 class="text-xs font-mono uppercase tracking-wider text-zinc-200 mb-3 flex items-center gap-2 font-bold">
                <span class="text-cyan-400">[+]</span> Add Custom Directive
            </h3>
            <form id="add-task-form" class="space-y-3">
                <input type="text" id="new-task-title" placeholder="e.g., Secure perimeter gate" required
                    class="w-full px-4 py-3 rounded border border-zinc-700 text-sm focus:outline-none focus:border-cyan-500 bg-zinc-950 text-zinc-100 placeholder-zinc-500 font-medium">
                <div class="flex gap-2">
                    <select id="new-task-category" class="flex-1 px-3 py-2.5 rounded border border-zinc-700 text-xs font-mono uppercase bg-zinc-950 text-zinc-200 font-semibold focus:outline-none focus:border-cyan-500">
                        <option value="Indoor">Indoor</option>
                        <option value="Garage">Garage</option>
                        <option value="Yard & Outdoor">Yard & Outdoor</option>
                        <option value="Pool & Patio">Pool & Patio</option>
                    </select>
                    <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white font-mono uppercase font-bold px-5 py-2.5 rounded text-xs transition shadow active:scale-95">Commit</button>
                </div>
            </form>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBQEmNlMDakeMhnQ9Xzgif5mzW3nfuP5L8",
            authDomain: "checklist-1-f8216.firebaseapp.com",
            projectId: "checklist-1-f8216",
            storageBucket: "checklist-1-f8216.firebasestorage.app",
            messagingSenderId: "912080341332",
            appId: "1:912080341332:web:c36eb66c252bcc8b7aa0c1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'shared-home-checklist';

        let currentFilter = 'all';
        let isSyncing = false;
        let isOnlineConnected = false;

        const defaultTasks = [
            { id: 1, title: "Fix living room curtain rod & brackets", category: "Indoor", completed: false, notes: "Secure loose anchor screws and check tension." },
            { id: 2, title: "Clean and rearrange garage", category: "Garage", completed: false, notes: "Sort bins, sweep floor, create clear walkways." },
            { id: 3, title: "Install tool & rake holder on garage wall", category: "Garage", completed: false, notes: "Find stud with stud finder before mounting rack." },
            { id: 4, title: "Acquire 10 bags of mulch from Home Depot", category: "Yard & Outdoor", type: "counter", current: 0, target: 10, completed: false, notes: "Tap buttons to track payload units (0/10)" },
            { id: 5, title: "Pick up stone from Home Depot", category: "Yard & Outdoor", completed: false, notes: "Verify quantities and stone grade prior to dispatch." },
            { id: 6, title: "Spread mulch in garden beds", category: "Yard & Outdoor", type: "slider", progress: 0, completed: false, notes: "Adjust slider to 100% to finalize spreading operation." },
            { id: 7, title: "Lay down stone / gravel", category: "Yard & Outdoor", completed: false, notes: "Spread evenly over weed barrier fabric." },
            { id: 8, title: "Touch up white paint around pool area", category: "Pool & Patio", completed: false, notes: "Scrape flaky areas, prime, and apply weather-resistant white paint." },
            { id: 9, title: "Cut down palm limbs in backyard", category: "Yard & Outdoor", completed: false, notes: "Wear PPE gear, trim close to trunk safely." },
            { id: 10, title: "Clean and degrease BBQ grill", category: "Yard & Outdoor", completed: false, notes: "Soak grates in warm soapy water, scrub burners." },
            { id: 11, title: "Touch up nicks and scuffs on indoor walls", category: "Indoor", completed: false, notes: "Use matching wall paint sample and small artist brush." }
        ];

        let tasks = defaultTasks;
        try {
            const savedLocal = localStorage.getItem('home_tasks_reactive_v2');
            if (savedLocal) tasks = JSON.parse(savedLocal);
        } catch (e) {}

        renderTasks();

        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'checklist_state');

        async function saveTasksToStorage() {
            try {
                localStorage.setItem('home_tasks_reactive_v2', JSON.stringify(tasks));
            } catch (e) {}

            if (isSyncing) return;
            try {
                await setDoc(docRef, { tasks: tasks, lastUpdated: Date.now() });
            } catch (err) {}
        }

        signInAnonymously(auth).then(() => {
            isOnlineConnected = true;
            onSnapshot(docRef, (docSnap) => {
                isSyncing = true;
                if (docSnap.exists() && docSnap.data().tasks) {
                    tasks = docSnap.data().tasks;
                    try { localStorage.setItem('home_tasks_reactive_v2', JSON.stringify(tasks)); } catch (e) {}
                } else {
                    setDoc(docRef, { tasks: tasks, lastUpdated: Date.now() });
                }
                isSyncing = false;
                renderTasks();
            }, (error) => {
                isOnlineConnected = false;
                const badge = document.getElementById('sync-status');
                if (badge) {
                    badge.className = "text-[9px] mono-font uppercase tracking-widest bg-amber-500/20 text-amber-300 px-2.5 py-0.5 rounded border border-amber-500/40";
                    badge.innerText = "LOCAL MODE (CHECK RULES)";
                }
            });
        }).catch(() => { isOnlineConnected = false; });

        setInterval(async () => {
            if (!isOnlineConnected) return;
            const start = performance.now();
            try {
                await setDoc(docRef, { lastPing: Date.now() }, { merge: true });
                const duration = ((performance.now() - start) / 1000).toFixed(2);
                const badge = document.getElementById('sync-status');
                if (badge) {
                    badge.className = "text-[9px] mono-font uppercase tracking-widest bg-emerald-500/20 text-emerald-300 px-2.5 py-0.5 rounded border border-emerald-500/40";
                    badge.innerText = `PULSE OK // ${duration}s`;
                }
            } catch (e) {}
        }, 5000);

        // Global Event Delegation
        document.getElementById('task-list').addEventListener('click', (e) => {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            const action = target.dataset.action;
            const id = Number(target.dataset.id);

            if (action === 'toggle') {
                tasks = tasks.map(t => (t.id === id && !t.type) ? { ...t, completed: !t.completed } : t);
                saveTasksToStorage();
                renderTasks();
            } else if (action === 'counter-sub') {
                updateCounterValue(id, -1);
            } else if (action === 'counter-add') {
                updateCounterValue(id, 1);
            } else if (action === 'delete') {
                tasks = tasks.filter(t => t.id !== id);
                saveTasksToStorage();
                renderTasks();
            }
        });

        document.getElementById('task-list').addEventListener('input', (e) => {
            if (e.target.matches('.task-slider')) {
                const id = Number(e.target.dataset.id);
                const val = parseInt(e.target.value, 10);
                
                tasks = tasks.map(t => {
                    if (t.id === id && t.type === 'slider') {
                        return { ...t, progress: val, completed: val >= 100, notes: `Operation progress (${val}%)` };
                    }
                    return t;
                });
                
                const valSpan = document.getElementById(`slider-val-${id}`);
                if (valSpan) valSpan.innerText = `${val}%`;
                updateProgressBarOnly();
            }
        });

        document.getElementById('task-list').addEventListener('change', (e) => {
            if (e.target.matches('.task-slider')) {
                saveTasksToStorage();
                renderTasks();
            }
        });

        function updateCounterValue(id, delta) {
            tasks = tasks.map(t => {
                if (t.id === id && t.type === 'counter') {
                    const newCurrent = Math.max(0, Math.min(t.target, t.current + delta));
                    return { ...t, current: newCurrent, completed: newCurrent >= t.target, notes: `Tracked payload units (${newCurrent}/${t.target})` };
                }
                return t;
            });
            saveTasksToStorage();
            renderTasks();
        }

        document.querySelectorAll('.filter-tab').forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentFilter = e.currentTarget.dataset.filter;
                document.querySelectorAll('.filter-tab').forEach(b => {
                    const active = b.dataset.filter === currentFilter;
                    b.className = active 
                        ? "filter-tab flex-1 py-2.5 rounded bg-cyan-600 text-white font-bold transition shadow" 
                        : "filter-tab flex-1 py-2.5 rounded text-zinc-300 transition hover:text-white font-semibold";
                });
                renderTasks();
            });
        });

        document.getElementById('add-task-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const titleInput = document.getElementById('new-task-title');
            const catInput = document.getElementById('new-task-category');
            
            tasks.push({
                id: Date.now(),
                title: titleInput.value.trim(),
                category: catInput.value,
                completed: false,
                notes: "User-defined custom directive."
            });
            titleInput.value = '';
            saveTasksToStorage();
            renderTasks();
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            if (confirm("Reset task parameters to default specifications?")) {
                tasks = JSON.parse(JSON.stringify(defaultTasks));
                saveTasksToStorage();
                renderTasks();
            }
        });

        function getCategoryBadge(category) {
            const colors = {
                'Indoor': 'bg-purple-950 text-purple-200 border border-purple-700/60 font-semibold',
                'Garage': 'bg-amber-950 text-amber-200 border border-amber-700/60 font-semibold',
                'Yard & Outdoor': 'bg-emerald-950 text-emerald-200 border border-emerald-700/60 font-semibold',
                'Pool & Patio': 'bg-cyan-950 text-cyan-200 border border-cyan-700/60 font-semibold'
            };
            return colors[category] || 'bg-zinc-800 text-zinc-200';
        }

        function calculateCompletedEquivalent() {
            let totalScore = 0;
            tasks.forEach(t => {
                if (t.completed) totalScore += 1;
                else if (t.type === 'slider' && t.progress > 0) totalScore += (t.progress / 100);
                else if (t.type === 'counter' && t.target > 0) totalScore += (t.current / t.target);
            });
            return totalScore;
        }

        function updateProgressBarOnly() {
            const totalCount = tasks.length;
            const completedEquivalent = calculateCompletedEquivalent();
            const percent = totalCount > 0 ? Math.round((completedEquivalent / totalCount) * 100) : 0;
            const formattedCompleted = Number.isInteger(completedEquivalent) ? completedEquivalent : completedEquivalent.toFixed(1);

            document.getElementById('progress-text').innerText = `${formattedCompleted} of ${totalCount} completed`;
            document.getElementById('progress-percent').innerText = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;

            document.getElementById('header-watermark-tl').innerText = `${percent}%`;
            document.getElementById('header-watermark-br').innerText = `${percent}%`;
        }

        function renderTasks() {
            const container = document.getElementById('task-list');
            if (!container) return;

            const filtered = tasks.filter(t => {
                if (currentFilter === 'active') return !t.completed;
                if (currentFilter === 'completed') return t.completed;
                return true;
            });

            updateProgressBarOnly();

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 bg-zinc-900 rounded-lg border border-zinc-700">
                        <p class="text-zinc-400 text-xs font-mono uppercase tracking-wider font-semibold">No matching active logs</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(t => {
                let interactiveElement = '';
                
                if (t.type === 'counter') {
                    interactiveElement = `
                        <div class="mt-3.5 bg-zinc-950 p-3.5 rounded border border-zinc-700">
                            <div class="flex justify-between items-center mb-2.5">
                                <span class="text-xs font-mono text-zinc-300 font-semibold">UNITS LOADED: <span class="text-cyan-400 font-bold text-sm">${t.current}</span> / ${t.target}</span>
                                <div class="flex gap-2">
                                    <button type="button" data-action="counter-sub" data-id="${t.id}" class="w-11 h-11 bg-zinc-900 border border-zinc-600 rounded text-zinc-100 font-mono font-bold text-lg flex items-center justify-center active:bg-zinc-800 shadow-sm transition">-</button>
                                    <button type="button" data-action="counter-add" data-id="${t.id}" class="w-11 h-11 bg-cyan-600 text-white rounded font-mono font-bold text-lg flex items-center justify-center active:bg-cyan-500 shadow-sm transition">+</button>
                                </div>
                            </div>
                            <div class="flex gap-1.5 mt-2">
                                ${Array.from({length: t.target}, (_, i) => `
                                    <div class="h-3 flex-1 rounded-xs ${i < t.current ? 'bg-cyan-500 shadow-[0_0_6px_rgba(6,182,212,0.6)]' : 'bg-zinc-800 border border-zinc-700'} transition-all"></div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } else if (t.type === 'slider') {
                    interactiveElement = `
                        <div class="mt-3.5 bg-zinc-950 p-3.5 rounded border border-zinc-700">
                            <div class="flex justify-between items-center mb-2.5 text-xs font-mono">
                                <span class="text-zinc-300 font-semibold uppercase">Operation Progress</span>
                                <span id="slider-val-${t.id}" class="text-cyan-400 font-bold text-sm">${t.progress}%</span>
                            </div>
                            <input type="range" min="0" max="100" value="${t.progress}" data-id="${t.id}" class="task-slider w-full cursor-pointer py-2">
                        </div>
                    `;
                }

                const isChecked = t.completed ? 'checked' : '';
                const checkboxOrIndicator = t.type 
                    ? `<div class="mt-1 h-7 w-7 rounded flex items-center justify-center text-xs font-mono font-bold ${t.completed ? 'bg-emerald-600 text-white shadow-[0_0_8px_rgba(34,197,94,0.4)]' : 'bg-zinc-950 text-zinc-400 border border-zinc-600'}">${t.completed ? '✓' : '•'}</div>`
                    : `<input type="checkbox" ${isChecked} data-action="toggle" data-id="${t.id}" class="mt-1 h-7 w-7 cursor-pointer">`;

                return `
                    <div class="bg-zinc-900 p-4 rounded-lg border border-zinc-700 shadow-md flex items-start gap-3.5 transition">
                        ${checkboxOrIndicator}
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between gap-2">
                                <span class="text-[10px] font-mono uppercase font-bold px-2 py-0.5 rounded ${getCategoryBadge(t.category)}">${t.category}</span>
                                <button type="button" data-action="delete" data-id="${t.id}" class="text-zinc-400 hover:text-red-400 font-mono text-lg px-2.5 py-0.5 font-bold">&times;</button>
                            </div>
                            <h4 class="text-sm font-medium mt-2 leading-relaxed break-words ${t.completed ? 'completed-task text-zinc-500' : 'text-zinc-100 font-semibold'}">${t.title}</h4>
                            ${t.notes ? `<p class="text-xs font-mono text-zinc-300 mt-1.5 leading-normal break-words">${t.notes}</p>` : ''}
                            ${interactiveElement}
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
